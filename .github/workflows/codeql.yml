name: CodeQL

# Em repositorio privado o code scanning exige GitHub Advanced Security, que
# esta conta nao tem: desde que o repo virou privado (23/10/2026) a analise
# falhava toda segunda. O job agora so roda com o repo publico, e volta sozinho
# se ele for publicado de novo.
#
# Por isso ele nao roda em push nem em pull request: uma falha semanal por
# licenca e um aviso, uma falha em todo push e um estorvo. Com GHAS ligado,
# acrescente os gatilhos `push` e `pull_request` para ter analise nos PRs.

on:
  schedule:
    - cron: "30 6 * * 1"   # toda segunda, logo depois do pip-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analise:
    name: analise estatica (python)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # necessario para publicar os alertas
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
